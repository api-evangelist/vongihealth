name: Vongi Health (芝兰健康)
description: Vongi Health (芝兰健康, Hangzhou Zhilan Health Co., Ltd., also branded Slan Health) is a Qiming
  Venture Partners-backed Chinese digital therapeutics company founded in Hangzhou in 2015. Its hepatitis
  B mother-to-child transmission prevention digital therapeutic (小贝壳) was the first digital therapeutic
  certified by China's NMPA, and it also operates a sleep specialty (CBT-I) digital therapeutics platform
  and a DTx CDMO business covering product R&D, clinical research, regulatory registration, and commercial
  operations. The company publishes no public API or developer surface.
